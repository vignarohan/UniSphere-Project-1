<div class="table-scroll"><table class="data-table"><thead><tr><th>Title</th><th>Subject</th><th>Due date</th><th>Status</th><th class="action-cell">Action</th></tr></thead><tbody>
{% for row in rows %}<tr><td class="strong-cell">{{ row.assignment.title }}</td><td>{{ row.assignment.offering.title }}</td><td class="nowrap">{{ row.assignment.due_at|date:'d M' }}</td><td><span class="status {{ row.status_class }}">{{ row.status }}</span></td><td class="action-cell"><a class="button small-button secondary" href="{% url 'assignment-detail' row.assignment.pk %}">Open<span class="sr-only"> {{ row.assignment.title }}</span></a></td></tr>{% empty %}<tr><td colspan="5" class="empty-cell">No assignments to show.</td></tr>{% endfor %}
</tbody></table></div>
