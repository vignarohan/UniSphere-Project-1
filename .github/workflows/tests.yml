name: Django foundation checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: unisphere
          POSTGRES_USER: unisphere
          POSTGRES_PASSWORD: isolated-ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unisphere -d unisphere"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm run build:css
      - run: python manage.py collectstatic --noinput --verbosity 0
      - run: python manage.py check --fail-level WARNING
      - run: python manage.py makemigrations --check --dry-run
      - name: Test SQLite quick start
        run: python manage.py test core --verbosity 1
      - name: Test PostgreSQL
        env:
          DATABASE_URL: postgresql://unisphere:isolated-ci-test-password@127.0.0.1:5432/unisphere
        run: python manage.py test core --verbosity 1
